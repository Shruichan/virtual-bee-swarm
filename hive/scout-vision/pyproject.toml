[project]
name = "scout-vision"
version = "0.1.0"
description = "Live Bee Scout: recognize the six booth objects in the glasses' video stream"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open_clip_torch>=2.26",
    "transformers>=4.44",
    "opencv-python>=4.10",
    "pillow>=10",
    "numpy>=2.0",
    "requests>=2.32",
    "ultralytics>=8.3",
]

[tool.uv]
package = false
